name: Wealth logger

on:
  schedule:
    # Twice a day, late UTC, for redundancy: if one run fails (API hiccup,
    # etc.) the other still captures the day. History is daily-deduped, so
    # both land on the same day's single point (latest wins) — the page reads
    # the live value for "today" regardless.
    - cron: "37 21 * * *"   # 21:37 UTC
    - cron: "37 23 * * *"   # 23:37 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writer
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    outputs:
      # The commit it pushed, empty if there was no new data.
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run logger
        run: python wealth_log.py
      - name: Commit data
        id: commit
        run: |
          git config user.name "wealth-log-bot"
          git config user.email "wealth-log-bot@users.noreply.github.com"
          git add data/wealth 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "wealth-log: $(date -u +%FT%TZ)"
            git pull --rebase origin main
            git push
            echo "pushed=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # A push with GITHUB_TOKEN starts no workflow, so the new data goes live
  # through this call to the site workflow, which builds the pushed commit.
  deploy:
    needs: log
    if: needs.log.outputs.pushed != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.log.outputs.pushed }}

