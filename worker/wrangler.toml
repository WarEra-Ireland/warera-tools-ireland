name = "warera-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"

workers_dev = true
preview_urls = false

[vars]
ALLOWED_ORIGINS = "https://we.hawtre.net"

# owner/repo that receives repository_dispatch events from /deal-config-submit.
GITHUB_REPO = "hawtre/warera-tools-ireland"

# Secrets
#
#   wrangler secret put WARERA_API_KEYS        # required: game API token(s),
#                                              #   comma-separated; requests are
#                                              #   spread evenly across them.
#                                              #   WARERA_API_KEY (singular) is
#                                              #   still read as a fallback.
#                                              #   At least one must belong to a
#                                              #   Premium account: some
#                                              #   procedures (work.getStats*)
#                                              #   refuse other keys, and the
#                                              #   pool routes them accordingly.
#   wrangler secret put GITHUB_DISPATCH_TOKEN  # optional: fine-grained PAT,
#                                              #   Contents:read + Actions:write
#   wrangler secret put DISCORD_WEBHOOK_URL    # optional: Discord webhook
