[package]
name = "employee-model"
version = "0.1.0"
edition = "2024"
publish = false
description = "The employee model (training, projection, careers, planner) for the WarEra tools site"

[lib]
# Nothing links the rlib, but without it rustc lays out the cdylib differently:
# a .wasm about 6% larger (2026-11-07). Kept so the code stays as profiled.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly: build.sh checks the installed wasm-bindgen-cli against it.
wasm-bindgen = "=0.2.130"
serde = { version = "1", default-features = false, features = ["derive", "std", "rc"] }
serde-wasm-bindgen = "0.6.5"

[profile.release]
opt-level = 3          # speed: the career and projection loops land here
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"   # keeps the target_features section wasm-bindgen reads
